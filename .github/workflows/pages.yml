name: Deploy AI Topic Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete WordPress snapshot
        run: python3 scripts/build_snapshot.py

      - name: Pin visible header logo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          local_ref = './assets/ai-competence-logo-header.png?v=20260805-2148'
          absolute_ref = 'https://raw.githubusercontent.com/RoX88/AIC/main/assets/ai-competence-logo-header.png?v=20260805-2207'
          occurrences = html.count(local_ref)
          if occurrences != 2:
              raise SystemExit(f'Expected two local logo references, found {occurrences}')
          html = html.replace(local_ref, absolute_ref)
          path.write_text(html, encoding='utf-8')
          print('Pinned both logo references to the absolute repository asset URL')
          PY

      - name: Remove public refresh diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/app.js')
          js = path.read_text(encoding='utf-8')

          progress = "    status.textContent = `Checking live WordPress page ${Math.min(start + 4, totalPages)} of ${totalPages}…`;\n"
          js = js.replace(progress, '', 1)

          partial_live = "\n".join([
              "  } else {",
              "    status.textContent = `Six-hour server snapshot · ${articles.length.toLocaleString()} articles · live REST returned ${live.length.toLocaleString()}`;",
              "    status.classList.add('warn');",
              "  }",
          ])
          quiet_partial = "\n".join([
              "  } else {",
              "    status.textContent = `${activeSource} · ${articles.length.toLocaleString()} articles`;",
              "    status.classList.remove('warn');",
              "  }",
          ])
          if partial_live not in js:
              raise SystemExit('Partial live-refresh status block not found')
          js = js.replace(partial_live, quiet_partial, 1)

          public_failure = "\n".join([
              "    if (snapshotLoaded) {",
              "      status.textContent = `${activeSource} · ${articles.length.toLocaleString()} articles · live refresh unavailable`;",
              "      status.classList.add('warn');",
              "      error.textContent = `The live WordPress refresh was unavailable, so the complete server snapshot remains active. ${liveError.message}`;",
              "      error.classList.remove('hidden');",
              "    } else {",
          ])
          quiet_failure = "\n".join([
              "    if (snapshotLoaded) {",
              "      status.textContent = `${activeSource} · ${articles.length.toLocaleString()} articles`;",
              "      status.classList.remove('warn');",
              "      error.textContent = '';",
              "      error.classList.add('hidden');",
              "    } else {",
          ])
          if public_failure not in js:
              raise SystemExit('Public live-refresh failure block not found')
          js = js.replace(public_failure, quiet_failure, 1)

          detailed_outage = "      error.textContent = `Neither the server snapshot nor WordPress could be loaded. ${liveError.message}`;"
          neutral_outage = "      error.textContent = 'The article index is temporarily unavailable. Please try again shortly.';"
          if detailed_outage not in js:
              raise SystemExit('Detailed outage message not found')
          js = js.replace(detailed_outage, neutral_outage, 1)

          forbidden = 'The live WordPress refresh was unavailable, so the complete server snapshot remains active.'
          if forbidden in js:
              raise SystemExit('Public WordPress diagnostic still present')

          path.write_text(js, encoding='utf-8')
          print('Public WordPress refresh diagnostics removed')
          PY

      - name: Validate snapshot and header asset
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          snapshot = Path('data/articles.snapshot.json')
          payload = json.loads(snapshot.read_text(encoding='utf-8'))
          count = int(payload.get('count', 0))
          articles = payload.get('articles', [])
          assert count == len(articles), (count, len(articles))
          assert count >= 100, count
          assert len({item['url'] for item in articles}) == count

          logo = Path('assets/ai-competence-logo-header.png')
          data = logo.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (600, 108), (width, height)

          html = Path('index.html').read_text(encoding='utf-8')
          absolute_ref = 'https://raw.githubusercontent.com/RoX88/AIC/main/assets/ai-competence-logo-header.png?v=20260805-2207'
          assert html.count(absolute_ref) == 2
          assert './assets/ai-competence-logo-header.png' not in html
          assert 'height:34px;width:auto' in html
          assert 'width="600" height="108"' in html
          assert './assets/brand.js' not in html

          app = Path('assets/app.js').read_text(encoding='utf-8')
          assert 'The live WordPress refresh was unavailable, so the complete server snapshot remains active.' not in app
          assert 'live refresh unavailable' not in app
          print(f'Validated {count} articles, header asset, and silent refresh fallback')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
