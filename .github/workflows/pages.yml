name: Deploy AI Topic Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete WordPress snapshot
        run: python3 scripts/build_snapshot.py

      - name: Apply original proportional logo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = {
              'ai-competence-logo.png?v=20260805-2101': 'ai-competence-logo.png?v=20260805-2140',
              '.header{height:74px;': '.header{height:66px;',
              '.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none}': '.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;line-height:0;overflow:visible}',
              '.brand-logo{display:block;width:228px;height:auto;max-height:42px;object-fit:contain;object-position:left center;flex:0 0 auto}': '.brand-logo{display:block;width:160px;height:auto;max-width:100%;max-height:none;object-fit:contain;object-position:left center;flex:0 0 auto;overflow:visible}',
              '.brand-section{padding-left:12px;': '.brand-section{padding-left:10px;',
              '@media(max-width:760px){.brand-logo{width:190px;max-height:35px}': '@media(max-width:760px){.brand-logo{width:145px;height:auto;max-height:none}',
              '@media(max-width:620px){.header{height:66px}.brand-logo{width:168px;max-height:31px}': '@media(max-width:620px){.header{height:60px}.brand-logo{width:132px;height:auto;max-height:none}',
              '@media(max-width:430px){.header{padding-left:14px;padding-right:14px}.brand-logo{width:150px;max-height:28px}': '@media(max-width:430px){.header{padding-left:14px;padding-right:14px}.brand-logo{width:118px;height:auto;max-height:none}',
          }

          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Expected header fragment not found: {old}')
              html = html.replace(old, new)

          path.write_text(html, encoding='utf-8')
          print('Applied untouched 1189x215 PNG with proportional CSS scaling')
          PY

      - name: Validate snapshot and logo proportions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = Path('data/articles.snapshot.json')
          payload = json.loads(snapshot.read_text(encoding='utf-8'))
          count = int(payload.get('count', 0))
          articles = payload.get('articles', [])
          assert count == len(articles), (count, len(articles))
          assert count >= 100, count
          assert len({item['url'] for item in articles}) == count

          html = Path('index.html').read_text(encoding='utf-8')
          logo_ref = 'ai-competence-logo.png?v=20260805-2140'
          assert html.count(logo_ref) == 2
          assert 'ai-competence-logo-clean' not in html
          assert 'width:160px;height:auto;max-width:100%;max-height:none' in html
          assert 'width="1189" height="215"' in html
          assert './assets/brand.js' not in html
          assert Path('assets/ai-competence-logo.png').is_file()
          print(f'Validated {count} articles and unchanged 1189:215 logo ratio')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
