name: Deploy AI Topic Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete WordPress snapshot
        run: python3 scripts/build_snapshot.py

      - name: Validate snapshot and header asset
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          snapshot = Path('data/articles.snapshot.json')
          payload = json.loads(snapshot.read_text(encoding='utf-8'))
          count = int(payload.get('count', 0))
          articles = payload.get('articles', [])
          assert count == len(articles), (count, len(articles))
          assert count >= 100, count
          assert len({item['url'] for item in articles}) == count

          logo = Path('assets/ai-competence-logo-header.png')
          data = logo.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (600, 108), (width, height)

          html = Path('index.html').read_text(encoding='utf-8')
          assert './assets/brand.js' not in html
          print(f'Validated {count} articles and 600x108 Intelligence header logo')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
